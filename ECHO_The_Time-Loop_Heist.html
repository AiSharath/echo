function fin(){show(`<h2>THE VAULT IS OPEN</h2><p>${L.length} timelines.<br>Countless possibilities.<br>One perfect sequence.</p><p>You escaped the loop.</p><p>TOTAL TIMELINES: ${tot.tl}<br>TOTAL TIME: ${tot.t.toFixed(0)}s<br>PARADOXES: ${tot.px}<br>LEVELS COMPLETED: ${D.done.length}</p>${bt('PLAY AGAIN','tot={tl:0,t:0,px:0};go(0)')}${bt('LEVEL SELECT','sel()')}`)}
function pause(){if(net)return;if(st=='play'){st='pause';pz()}else if(st=='pause')rs()}
function pz(){show(`<small class="ey">Level ${li+1} · ${lv.n}</small><h2>PAUSED</h2>${bt('RESUME','rs()','p')}${bt('RESTART TIMELINE','rt()')}${bt('RESTART LEVEL','go(li)')}${bt('SETTINGS','cfg(1)')}${bt('EXIT TO MENU','menu()')}`)}
function rs(){show('');st='play'}
addEventListener('keydown',e=>{k[e.code]=1;if(ov.style.display=='flex'&&/^Arrow/.test(e.code)&&e.target.tagName!='INPUT'){const b=[...ov.querySelectorAll('.b:not(:disabled)')],i=b.indexOf(document.activeElement);if(b.length){b[(i+(/Up|Left/.test(e.code)?-1:1)+b.length)%b.length].focus();e.preventDefault()}}if(st=='brief'&&(e.code=='Space'||e.code=='Enter'||/^(Key[WASD]|Arrow)/.test(e.code)))st='play';if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault();
if(e.code=='Escape')pause();if(e.code=='KeyG'&&!e.repeat&&st=='play'&&rec.length>20&&(!net||net.host))endTL();if(e.code=='KeyR'&&(st=='play'||st=='lost')){rt()}
if(e.code=='Backquote')dbg^=1;if(dbg&&lv){if(e.code=='BracketRight')go(Math.min(L.length-1,li+1));if(e.code=='BracketLeft')go(Math.max(0,li-1))}});
addEventListener('keyup',e=>k[e.code]=0);addEventListener('blur',()=>{for(const c in k)k[c]=0;if(st=='play')pause()});

cv.onpointerdown=()=>{if(st=='brief')st='play'};let last=0,acc=0;function loop(t){const d=Math.min(.1,(t-last)/1000);last=t;acc+=d;while(acc>=1/60){tick();acc-=1/60}draw();requestAnimationFrame(loop)}
